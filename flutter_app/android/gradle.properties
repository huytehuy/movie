# NOTE for this machine: TEMP resolves to the 8.3 short path
# (C:\Users\KHANHH~1.PHA\...) and Windows AF_UNIX sockets reject short paths, so
# Gradle dies with "Unable to establish loopback connection". Gradle strips -D
# flags out of org.gradle.jvmargs, so the fix belongs in the environment:
#   JAVA_TOOL_OPTIONS=-Djdk.net.unixdomain.tmpdir=C:\Users\Public\gradle-tmp
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
